syntax = "proto3";

package executor.v1;

option go_package = "github.com/kruntimes/kruntimes/api/runtime/v1;runtimev1";

// Executor is the gRPC service that runtimes must implement.
// The agent sidecar calls this to delegate command execution.
service Runtime {
    rpc Execute(ExecuteRequest) returns (ExecuteResponse);
    rpc Status(StatusRequest) returns (StatusResponse);
    rpc List(ListRequest) returns (ListResponse);
    rpc Cancel(CancelRequest) returns (CancelResponse);
    // Forget releases a terminal execution and its retained output.
    // Running executions must be cancelled before they can be forgotten.
    rpc Forget(ForgetRequest) returns (ForgetResponse);
    rpc Health(HealthRequest) returns (HealthResponse);
}

// FunctionRuntime is an optional Runtime Server extension for function-mode
// lifecycle operations. Custom runtimes that support only one-shot execution
// implement Runtime only.
service FunctionRuntime {
    // RegisterFunction creates or resumes one local function registration.
    rpc RegisterFunction(RegisterFunctionRequest) returns (RegisterFunctionResponse);
    // FunctionStatus returns local readiness, activity, and fatal state.
    rpc FunctionStatus(FunctionStatusRequest) returns (FunctionStatusResponse);
    // InvokeFunction executes one bounded function invocation.
    rpc InvokeFunction(InvokeFunctionRequest) returns (InvokeFunctionResponse);
    // UnregisterFunction drains or cancels work and removes local state.
    rpc UnregisterFunction(UnregisterFunctionRequest) returns (UnregisterFunctionResponse);
}

// SessionRuntime is an optional Runtime Server extension for stateful session
// Runs. runtimed also implements this service for gateway traffic, forwarding
// requests only to the assigned Pod of the same Runtime when it is not the
// owner. runtimed owns queue admission and operation lifecycle; the Runtime
// Server owns local workspace confinement and process execution.
service SessionRuntime {
    // RegisterSession creates or resumes one local Session Run workspace.
    rpc RegisterSession(RegisterSessionRequest) returns (SessionStatus);
    // GetSessionStatus returns local session state for recovery and idle checks.
    rpc GetSessionStatus(GetSessionStatusRequest) returns (SessionStatus);
    // ExecuteSessionOperation executes one mutation already admitted by runtimed.
    rpc ExecuteSessionOperation(ExecuteSessionOperationRequest) returns (ExecuteSessionOperationResponse);
    // StreamSessionOperation executes one mutation and emits ordered progress and
    // terminal events. The owner runtimed serializes the operation.
    rpc StreamSessionOperation(ExecuteSessionOperationRequest) returns (stream SessionOperationEvent);
    // ReadSessionFile returns bounded contents of one workspace-relative file.
    rpc ReadSessionFile(ReadSessionFileRequest) returns (ReadSessionFileResponse);
    // ListSessionFiles lists workspace-relative directory entries.
    rpc ListSessionFiles(ListSessionFilesRequest) returns (ListSessionFilesResponse);
    // CloseSession removes local state after runtimed has fenced new operations.
    rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
}

message ExecuteRequest {
    string id = 1;
    repeated string args = 2;
    map<string, string> env = 3;
    int64 timeout_seconds = 4;
    string working_dir = 5;

    // entrypoint is the script file to execute within working_dir.
    string entrypoint = 6;
    // handler in module.function format (FaaS mode).
    string handler = 7;
}

message ExecuteResponse {
    string id = 1;
}

message StatusRequest {
    string id = 1;
}

message StatusResponse {
    string id = 1;
    ExecutionState state = 2;
    int32 exit_code = 3;
    string stdout = 4;
    string stderr = 5;
    string error_message = 6;
}

enum ExecutionState {
    EXECUTION_STATE_UNSPECIFIED = 0;
    EXECUTION_STATE_PENDING = 1;
    EXECUTION_STATE_RUNNING = 2;
    EXECUTION_STATE_SUCCEEDED = 3;
    EXECUTION_STATE_FAILED = 4;
}

message ListRequest {}

message ListResponse {
    repeated StatusResponse entries = 1;
}

message CancelRequest {
    string id = 1;
}

message CancelResponse {}

message ForgetRequest {
    string id = 1;
}

message ForgetResponse {}

message HealthRequest {}

message HealthResponse {
    bool healthy = 1;
    string message = 2;
}

// FunctionRegistration identifies one Runtime Server-local registration epoch.
message FunctionRegistration {
    // Kubernetes Run UID, not its mutable name.
    string run_uid = 1;
    // Opaque Runtime Server-generated ID for this local registration generation.
    string registration_id = 2;
}

enum FunctionRegistrationState {
    FUNCTION_REGISTRATION_STATE_UNSPECIFIED = 0;
    FUNCTION_REGISTRATION_STATE_REGISTERING = 1;
    FUNCTION_REGISTRATION_STATE_READY = 2;
    FUNCTION_REGISTRATION_STATE_DRAINING = 3;
    FUNCTION_REGISTRATION_STATE_FAILED = 4;
}

message RegisterFunctionRequest {
    string run_uid = 1;
    int32 registration_attempt = 2;
    string working_dir = 3;
    string handler = 4;
    map<string, string> env = 5;
    int64 idle_timeout_seconds = 6;
    string registration_digest = 7;
}

message RegisterFunctionResponse {
    FunctionRegistration registration = 1;
    FunctionRegistrationState state = 2;
}

message FunctionStatusRequest {
    FunctionRegistration registration = 1;
}

message FunctionStatusResponse {
    FunctionRegistration registration = 1;
    FunctionRegistrationState state = 2;
    int32 in_flight = 3;
    int64 last_activity_unix_nano = 4;
    string fatal_error = 5;
}

message InvokeFunctionRequest {
    FunctionRegistration registration = 1;
    string invocation_id = 2;
    bytes input = 3;
    string content_type = 4;
    int64 timeout_millis = 5;
}

message InvokeFunctionResponse {
    FunctionRegistration registration = 1;
    string invocation_id = 2;
    bytes output = 3;
    string content_type = 4;
    map<string, string> outputs = 5;
}

message UnregisterFunctionRequest {
    FunctionRegistration registration = 1;
    bool cancel_in_flight = 2;
    int64 drain_timeout_millis = 3;
}

message UnregisterFunctionResponse {
    FunctionRegistration registration = 1;
}

// SessionIdentity fences a Runtime Server-local session to one Run assignment.
message SessionIdentity {
    // Kubernetes Run UID, not its mutable name.
    string run_uid = 1;
    // Kubernetes UID of the Runtime Pod assigned to this Run. It fences a
    // recreated Pod that happens to reuse the same name.
    string assigned_pod_uid = 2;
}

enum SessionState {
    SESSION_STATE_UNSPECIFIED = 0;
    SESSION_STATE_REGISTERING = 1;
    SESSION_STATE_READY = 2;
    SESSION_STATE_CLOSING = 3;
    SESSION_STATE_CLOSED = 4;
    SESSION_STATE_FAILED = 5;
}

message RegisterSessionRequest {
    // Immutable assignment identity for the Session Run to register.
    SessionIdentity identity = 1;
    // Absolute path prepared by the owner runtimed below this Runtime's workspace.
    string working_dir = 2;
    // Environment overrides available to every session command.
    map<string, string> env = 3;
    // Idle lifetime requested by the Run. runtimed applies its own upper bound.
    int64 idle_timeout_seconds = 4;
}

message GetSessionStatusRequest {
    // Immutable assignment identity for the Session Run to inspect.
    SessionIdentity identity = 1;
}

message SessionStatus {
    // Immutable assignment identity of the local session.
    SessionIdentity identity = 1;
    // Current local Runtime Server lifecycle state.
    SessionState state = 2;
    // Unix timestamp for the latest accepted session operation.
    int64 last_activity_unix_nano = 3;
    // Runtime-defined terminal error when state is SESSION_STATE_FAILED.
    string fatal_error = 4;
}

// ExecuteSessionOperationRequest carries exactly one mutation. Owner runtimed
// serializes it in the session queue and applies policy before calling the
// local Runtime Server.
message ExecuteSessionOperationRequest {
    // Immutable assignment identity for the Session Run receiving this operation.
    SessionIdentity identity = 1;
    oneof operation {
        // Executes one command in the session workspace.
        SessionCommand command = 2;
        // Writes one bounded file in the session workspace.
        SessionFileWrite write_file = 3;
        // Creates one directory in the session workspace.
        SessionDirectoryCreate create_directory = 4;
        // Deletes one file or directory in the session workspace.
        SessionFileDelete delete_file = 5;
        // Renames one file or directory in the session workspace.
        SessionFileRename rename_file = 6;
    }
}

message SessionCommand {
    // argv executes a program directly. It must not be combined with shell.
    repeated string argv = 1;
    // shell explicitly executes this text through the Runtime's shell. It must
    // not be combined with argv.
    string shell = 2;
    // WorkingDirectory is workspace-relative. An empty value means the session
    // workspace root.
    string working_directory = 3;
    // Per-command environment overrides. These take precedence over session
    // environment values.
    map<string, string> env = 4;
    // Bounded standard input passed to the command.
    bytes stdin = 5;
    // TimeoutMillis is bounded by runtimed before this local call.
    int64 timeout_millis = 6;
}

message ExecuteSessionOperationResponse {
    // Command result when the request operation is command. It is absent for
    // successful file mutations.
    SessionCommandResult command = 1;
}

// SessionOperationEvent is one ordered event emitted while a Session operation
// is active. Owner runtimed assigns sequence to every event before forwarding it
// to callers.
message SessionOperationEvent {
    int64 sequence = 1;
    oneof event {
        // Accepted is emitted after runtimed has admitted the operation to its
        // per-Session FIFO queue.
        SessionOperationAccepted accepted = 2;
        // Output carries one bounded stdout or stderr chunk.
        SessionOperationOutput output = 3;
        // Progress carries a bounded Runtime-defined status, text delta, or
        // tool lifecycle event.
        SessionOperationProgress progress = 4;
        // Completed is emitted exactly once when an operation succeeds.
        ExecuteSessionOperationResponse completed = 5;
        // Failed is emitted exactly once after a stream has started when an
        // operation cannot complete successfully.
        SessionOperationFailure failed = 6;
    }
}

message SessionOperationAccepted {}

enum SessionOperationOutputStream {
    SESSION_OPERATION_OUTPUT_STREAM_UNSPECIFIED = 0;
    SESSION_OPERATION_OUTPUT_STREAM_STDOUT = 1;
    SESSION_OPERATION_OUTPUT_STREAM_STDERR = 2;
}

message SessionOperationOutput {
    SessionOperationOutputStream stream = 1;
    bytes data = 2;
}

enum SessionOperationProgressKind {
    SESSION_OPERATION_PROGRESS_KIND_UNSPECIFIED = 0;
    SESSION_OPERATION_PROGRESS_KIND_STATUS = 1;
    SESSION_OPERATION_PROGRESS_KIND_TEXT_DELTA = 2;
    SESSION_OPERATION_PROGRESS_KIND_TOOL_CALL_STARTED = 3;
    SESSION_OPERATION_PROGRESS_KIND_TOOL_CALL_FINISHED = 4;
}

message SessionOperationProgress {
    SessionOperationProgressKind kind = 1;
    // Message is human-readable, bounded progress text.
    string message = 2;
    // ToolCallID and ToolName identify tool lifecycle events when applicable.
    string tool_call_id = 3;
    string tool_name = 4;
    // Data is a bounded JSON payload whose schema is defined by kind and the
    // Runtime. ContentType defaults to application/json when data is present.
    bytes data = 5;
    string content_type = 6;
}

message SessionOperationFailure {
    // Code is the numeric gRPC status code for the terminal error.
    int32 code = 1;
    // Message is safe to disclose to an authorized caller.
    string message = 2;
}

message SessionCommandResult {
    // Process exit code. A timeout uses -1.
    int32 exit_code = 1;
    // Bounded standard output captured from the process.
    bytes stdout = 2;
    // Bounded standard error captured from the process.
    bytes stderr = 3;
    // True when runtimed's operation timeout terminated the process group.
    bool timed_out = 4;
}

message ReadSessionFileRequest {
    // Immutable assignment identity for the Session Run owning the file.
    SessionIdentity identity = 1;
    // Workspace-relative file path to read.
    string path = 2;
    // MaxBytes bounds response contents. runtimed supplies a bounded value.
    int64 max_bytes = 3;
}

message ReadSessionFileResponse {
    // File bytes, limited by the requested and configured maximum.
    bytes contents = 1;
    // True when the file contains bytes beyond contents.
    bool truncated = 2;
}

message ListSessionFilesRequest {
    // Immutable assignment identity for the Session Run owning the directory.
    SessionIdentity identity = 1;
    // An empty path lists the session workspace root.
    string path = 2;
    // Maximum direct children to return. Zero asks the Runtime Server to use
    // its default; a non-zero value must be within the supported page bounds.
    int32 limit = 3;
    // Opaque cursor returned by a prior ListSessionFiles response for this
    // directory. An empty value starts at the first direct child.
    string page_token = 4;
}

message SessionFileInfo {
    // Entry name relative to the directory requested by ListSessionFiles.
    string path = 1;
    // Whether the entry is a directory.
    bool directory = 2;
    // Entry size in bytes as reported by the Runtime filesystem.
    int64 size_bytes = 3;
}

message ListSessionFilesResponse {
    // Direct child entries in the requested workspace-relative directory.
    repeated SessionFileInfo entries = 1;
    // Opaque cursor for the next page. Empty means there are no later entries.
    string next_page_token = 2;
}

message SessionFileWrite {
    // Workspace-relative destination file path.
    string path = 1;
    // Bounded bytes to write to path.
    bytes contents = 2;
    // Whether missing parent directories may be created.
    bool create_parents = 3;
}

message SessionDirectoryCreate {
    // Workspace-relative directory path to create, including missing parents.
    string path = 1;
}

message SessionFileDelete {
    // Workspace-relative file or directory path to delete.
    string path = 1;
    // Whether a directory and its descendants may be deleted.
    bool recursive = 2;
}

message SessionFileRename {
    // Existing workspace-relative source path.
    string source_path = 1;
    // New workspace-relative destination path.
    string destination_path = 2;
    // Whether an existing destination may be replaced.
    bool overwrite = 3;
}

message CloseSessionRequest {
    // Immutable assignment identity for the Session Run to close.
    SessionIdentity identity = 1;
}

message CloseSessionResponse {
    // Immutable assignment identity of the closed session.
    SessionIdentity identity = 1;
}
