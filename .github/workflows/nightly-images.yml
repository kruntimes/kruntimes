name: Nightly Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: nightly-images-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish nightly ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: scheduler
            dockerfile: Dockerfile.scheduler
          - image: controller
            dockerfile: Dockerfile.controller
          - image: runtimed
            dockerfile: Dockerfile.runtimed
          - image: gateway
            dockerfile: Dockerfile.gateway
          - image: runtime-log-apiserver
            dockerfile: Dockerfile.log-api
          - image: dashboard
            dockerfile: dashboard/Dockerfile
          - image: bash-runtime
            dockerfile: Dockerfile.bash-runtime
          - image: python-runtime
            dockerfile: Dockerfile.python-runtime

    steps:
      - uses: actions/checkout@v7

      - name: Resolve registry owner
        id: registry
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=raw,value=nightly
            type=sha,format=long,prefix=nightly-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              cosign sign --yes "${tag}@${DIGEST}"
            fi
          done <<< "${TAGS}"
