name: Release Charts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish charts for"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Helm OCI charts
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: azure/setup-helm@v5.0.1

      - name: Validate chart versions
        shell: bash
        run: ./hack/verify-release-version.sh "${RELEASE_TAG}"

      - name: Lint charts
        run: helm lint ./charts/kruntimes ./charts/kruntimes-runtimes

      - name: Package charts
        run: |
          mkdir -p dist/charts
          helm package ./charts/kruntimes --destination dist/charts
          helm package ./charts/kruntimes-runtimes --destination dist/charts

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "${GH_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Publish charts
        shell: bash
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          registry="oci://ghcr.io/${owner}/charts"
          for package in dist/charts/*.tgz; do
            helm push "${package}" "${registry}"
          done
