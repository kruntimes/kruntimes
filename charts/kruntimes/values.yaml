imagePullSecrets: []

scheduler:
  image: ghcr.io/kruntimes/scheduler
  imagePullPolicy: IfNotPresent
  replicas: 2
  leaderElect: true
  metricsBindAddress: ":8080"
  probeBindAddress: ":8081"
  metricsPort: 8080
  probePort: 8081
  podAnnotations: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

controller:
  image: ghcr.io/kruntimes/controller
  imagePullPolicy: IfNotPresent
  replicas: 1
  leaderElect: true
  metricsBindAddress: ":8082"
  probeBindAddress: ":8083"
  metricsPort: 8082
  probePort: 8083
  webhookPort: 9443
  webhookCertDir: /tmp/k8s-webhook-server/serving-certs
  podAnnotations: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# The aggregated Run-log API is independently authenticated through Kubernetes
# aggregation. kubectl, krt, and the Console use normal kubeconfig credentials.
logAPI:
  enabled: true
  image: ghcr.io/kruntimes/runtime-log-apiserver
  imagePullPolicy: IfNotPresent
  replicas: 2
  bindAddress: ":8445"
  containerPort: 8445
  servicePort: 443
  metricsBindAddress: ":8085"
  probeBindAddress: ":8086"
  probePort: 8086
  tls:
    secretName: ""
    certificateKey: tls.crt
    privateKeyKey: tls.key
    caBundleKey: ca.crt
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

console:
  image: ghcr.io/kruntimes/console
  imagePullPolicy: IfNotPresent
  replicas: 2
  bindAddress: ":8443"
  servicePort: 443
  containerPort: 8443
  publicRead:
    # When enabled, the Console ServiceAccount may list namespaces, Runs,
    # Runtimes, and WorkflowRuns without a user token. Details require a caller
    # Kubernetes bearer token. Log access is relayed through the aggregated
    # Run-log API, so callers do not need pods/log permission.
    enabled: true
  tls:
    # Certificate sources are mutually exclusive. With selfSigned enabled, the
    # chart generates this Secret (or preserves it across upgrades). To mount
    # an existing Secret, set selfSigned=false, certManager.enabled=false, and
    # secretName to that Secret. cert-manager writes the same target Secret.
    secretName: ""
    certificateKey: tls.crt
    privateKeyKey: tls.key
    caBundleKey: ca.crt
    # Optional Secret holding the CA that signs Kubernetes user client
    # certificates. When set, Console accepts a verified client certificate
    # for the Runtime access API and authorizes its CN/O with a SAR.
    clientCASecretName: ""
    clientCAKey: ca.crt
    selfSigned: true
    certManager:
      enabled: false
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io
  access:
    authorizationCacheTTL: 30s
    authorizationCacheCapacity: 1024
    maxConcurrentRequests: 128
    maxRequestBodyBytes: 1048576
    maxResponseBodyBytes: 1048576
    maxHeaderBytes: 1048576
  podAnnotations: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

runtimed:
  image: ghcr.io/kruntimes/runtimed
  session:
    # Platform-wide upper bounds. A Session Run may only lower queueSize and
    # operationTimeout in its own spec.
    maxQueueSize: 32
    maxOperationTimeout: 5m
    # Bounds how long runtimed waits for the Runtime Server to finish closing a
    # session after cancelling in-flight work.
    closeTimeout: 5s

workspace:
  emptyDir:
    sizeLimit: 10Gi

metrics:
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  # Disabled by default because ServiceMonitor is provided by Prometheus Operator,
  # not by Kubernetes itself. Enable only when the monitoring.coreos.com/v1
  # ServiceMonitor CRD is installed in the cluster.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
