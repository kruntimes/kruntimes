{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kruntimes.gateway.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kruntimes.gateway.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kruntimes.gateway.name" . }}
  labels:
    {{- include "kruntimes.gateway.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - kruntimes.io
    resources:
      - runs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kruntimes.gateway.name" . }}
  labels:
    {{- include "kruntimes.gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kruntimes.gateway.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kruntimes.gateway.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
