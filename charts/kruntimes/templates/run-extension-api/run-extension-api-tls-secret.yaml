{{- $api := include "kruntimes.runExtensionAPI.config" . | fromYaml }}
{{- if and $api.enabled (not $api.tls.secretName) }}
{{- include "kruntimes.runExtensionAPI.ensureTLSCertificates" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kruntimes.runExtensionAPI.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kruntimes.runExtensionAPI.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{ $api.tls.caBundleKey }}: {{ index .Values "_runExtensionAPICertificates" "caCert" | b64enc }}
  {{ $api.tls.certificateKey }}: {{ index .Values "_runExtensionAPICertificates" "tlsCert" | b64enc }}
  {{ $api.tls.privateKeyKey }}: {{ index .Values "_runExtensionAPICertificates" "tlsKey" | b64enc }}
{{- end }}
