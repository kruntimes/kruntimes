{{- if .Values.dashboard.enabled }}
{{- include "kruntimes.dashboard.validateTLS" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kruntimes.dashboard.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kruntimes.dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "kruntimes.dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.dashboard.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kruntimes.dashboard.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kruntimes.dashboard.name" . }}
      {{- with .Values.dashboard.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "kruntimes.image" (list . .Values.dashboard.image) }}
          imagePullPolicy: {{ .Values.dashboard.imagePullPolicy }}
          {{- with .Values.dashboard.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --bind-address={{ .Values.dashboard.bindAddress }}
            - --tls-certificate-file=/var/run/kruntimes/dashboard-tls/{{ .Values.dashboard.tls.certificateKey }}
            - --tls-private-key-file=/var/run/kruntimes/dashboard-tls/{{ .Values.dashboard.tls.privateKeyKey }}
            - --public-read={{ .Values.dashboard.publicRead.enabled }}
          ports:
            - containerPort: {{ .Values.dashboard.containerPort }}
              name: https
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: dashboard-tls
              mountPath: /var/run/kruntimes/dashboard-tls
              readOnly: true
      volumes:
        - name: dashboard-tls
          secret:
            secretName: {{ include "kruntimes.dashboard.tlsSecretName" . }}
{{- end }}
