{{- if .Values.console.publicRead.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kruntimes.console.name" . }}-public-read
  labels:
    {{- include "kruntimes.console.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["kruntimes.io"]
    resources: ["runs", "runtimes", "workflowruns"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kruntimes.console.name" . }}-public-read
  labels:
    {{- include "kruntimes.console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kruntimes.console.name" . }}-public-read
subjects:
  - kind: ServiceAccount
    name: {{ include "kruntimes.console.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
