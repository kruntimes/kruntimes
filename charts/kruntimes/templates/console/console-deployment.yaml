{{- include "kruntimes.console.validateTLS" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kruntimes.console.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kruntimes.console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      {{- include "kruntimes.console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.console.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kruntimes.console.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kruntimes.console.name" . }}
      {{- with .Values.console.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: {{ include "kruntimes.image" (list . .Values.console.image) }}
          imagePullPolicy: {{ .Values.console.imagePullPolicy }}
          {{- with .Values.console.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --bind-address={{ .Values.console.bindAddress }}
            - --tls-certificate-file=/var/run/kruntimes/console-tls/{{ .Values.console.tls.certificateKey }}
            - --tls-private-key-file=/var/run/kruntimes/console-tls/{{ .Values.console.tls.privateKeyKey }}
            - --public-read={{ .Values.console.publicRead.enabled }}
          ports:
            - containerPort: {{ .Values.console.containerPort }}
              name: https
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          volumeMounts:
            - name: console-tls
              mountPath: /var/run/kruntimes/console-tls
              readOnly: true
      volumes:
        - name: console-tls
          secret:
            secretName: {{ include "kruntimes.console.tlsSecretName" . }}
