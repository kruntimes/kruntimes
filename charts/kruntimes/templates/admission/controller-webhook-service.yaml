apiVersion: v1
kind: Service
metadata:
  name: {{ include "kruntimes.webhook.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kruntimes.controller.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kruntimes.controller.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: webhook
      protocol: TCP
