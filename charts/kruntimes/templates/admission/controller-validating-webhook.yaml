{{- include "kruntimes.webhook.ensureCertificates" . -}}
{{- $certificates := index .Values "_webhookCertificates" -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "kruntimes.webhook.name" . }}
  labels:
    {{- include "kruntimes.controller.labels" . | nindent 4 }}
webhooks:
  - name: runs.workspace.kruntimes.io
    admissionReviewVersions:
      - v1
    clientConfig:
      caBundle: {{ index $certificates "caCert" | b64enc }}
      service:
        name: {{ include "kruntimes.webhook.name" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate-kruntimes-io-v1alpha1-run
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 5
    rules:
      - apiGroups:
          - kruntimes.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
        resources:
          - runs
